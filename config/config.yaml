testing:
  host: "localhost"
  timeout_seconds: 2.0
  sampling:
    # Provide any 2 of the 3 parameters (the 3rd is derived automatically),
    # or all 3 consistently (conflicts raise ValueError).
    measurements_count: 30
    total_duration_seconds: 3.0
    sampling_frequency_hz: null

ammeters:
  greenlee:
    port: 5001
    command: "MEASURE_GREENLEE -get_measurement"
    method: "Ohm's Law (I = V / R)"
  entes:
    port: 5002
    command: "MEASURE_ENTES -get_data"
    method: "Hall Effect (I = B * K)"
  circutor:
    port: 5003
    command: "MEASURE_CIRCUTOR -get_measurement -current"
    method: "Rogowski Coil Integration (I = integral V dt)"

analysis:
  include_precision_metrics: false
  statistical_metrics:
    - mean
    - median
    - std_dev
    - min
    - max
  visualization:
    enabled: true
    output_dir: "results/plots"
    plot_types:
      - time_series
      - distribution
      - summary_comparison

result_management:
  save_path: "results/runs"
  log_dir: "results/logs"
  log_level: "VERBOSE"  # VERBOSE logs every sample reading; set to INFO in production
  format: "json"
