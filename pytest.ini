[pytest]
testpaths = tests
pythonpath = .
addopts = --template=html1/index.html --report=results/report.html -ra
filterwarnings =
    ignore::DeprecationWarning:matplotlib
markers =
    sanity: Fast pre-flight reachability checks per ammeter (fail-fast gate)
    greenlee: Functional and sanity tests for Greenlee ammeter
    entes: Functional and sanity tests for ENTES ammeter
    circutor: Functional and sanity tests for CIRCUTOR ammeter
    unit: Offline unit tests for config, logger, analyzer, storage, and visualizer
    negative: Error simulation and fault-handling tests
